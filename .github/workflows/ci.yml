name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  compat:
    # The lockfile pins the newest supported Pi. This job re-runs the same
    # checks against the oldest version peerDependencies still allows, so a
    # backward-incompatible API use fails here instead of in a user's terminal.
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.85.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npm install --no-save --no-package-lock
          @earendil-works/pi-coding-agent@${{ matrix.pi-version }}
          @earendil-works/pi-tui@${{ matrix.pi-version }}
      - run: npm run check
